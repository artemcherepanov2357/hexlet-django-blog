{% extends "base.html" %}

{% block content %}

{% if messages %}
    <ul>
        {% for message in messages %}
            <li style="color: green;">{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

{% if form.errors %}
    <div>
        <ul>
        {% for error in form.errors %}
            <li><strong>{{ error|escape }}</strong></li>
        {% endfor %}
        </ul>
    </div>
{% endif %}

<form action="{% url 'article:articles_update' id=article_id %}" method="post">
    {% csrf_token %}
    {{ form }}
    <input type="submit" value="Сохранить">
</form>
{% endblock %}
