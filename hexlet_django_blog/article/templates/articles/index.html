{% extends "base.html" %}

{% block content %}

<h1>Список статей</h1>

<!-- Вывод flash-сообщений -->
{% if messages %}
    {% for message in messages %}
        <div class="messages {% if message.tags %}{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<a href="{% url 'article:articles_create' %}" class="create-btn">Создать новую статью</a>



{% for article in articles %}
    <h2>
        <a href="{% url 'article:articles_show' article.id %}">
            {{ article.name }}
        </a>
        <a href="{% url 'article:articles_update' article.id %}" style="font-size: 14px; margin-left: 10px;">
            Редактировать
        </a>
    </h2>
    <div>{{ article.body|slice:":200" }}</div>
{% endfor %}

{% endblock %}
