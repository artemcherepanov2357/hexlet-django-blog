<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи</title>
</head>
<body>
    <h1>{{ app_name }}</h1>

    {% if articles %}
        <ul>
            {% for article in articles %}
                <li>{{ article.title }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Статей пока нет</p>
    {% endif %}
</body>
</html>
