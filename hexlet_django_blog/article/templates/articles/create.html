{% extends "base.html" %}

{% block content %}

<h2>Создать новую статью</h2>

<!-- Вывод flash-сообщений -->
{% if messages %}
    {% for message in messages %}
        <div class="messages {% if message.tags %}{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!-- Вывод ошибок формы -->
{% if form.errors %}
    <div style="color: red;">
        {% for error in form.errors %}
            <p>{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}

<form action="{% url 'article:articles_create' %}" method="post">
    {% csrf_token %}
    {{ form }}
    <input type="submit" value="Создать">
</form>

{% endblock %}
